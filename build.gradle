plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
}

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "skulkpk" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath = file("src/main/resources/skulkpk.accesswidener")
}

sourceSets {
    client {
        java {
            srcDirs += 'src/client/kotlin'
        }
    }
    test {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
    configureTests {
        createSourceSet = true
        modId = 'skulkpk-trials'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}

loom.runs.clientGameTest {
    property 'skulk.trials.output', file('build/parkour-results').absolutePath
    property 'skulk.trials.cases', providers.gradleProperty('trialCases').getOrElse('all')
    property 'skulk.trials.beams', providers.gradleProperty('trialBeams').getOrElse('false')
    property 'skulk.trials.repeats', providers.gradleProperty('trialRepeats').getOrElse('1')
}

loom.runs {
    parkourLive {
        client()
        source sourceSets.gametest
        runDir 'build/run/parkourLive'
        property 'skulk.trials.live', 'true'
        property 'skulk.trials.testFreeze', providers.gradleProperty('trialFreeze').getOrElse('false')
        property 'skulk.trials.output', file('build/parkour-results').absolutePath
        property 'skulk.trials.cases', providers.gradleProperty('trialCases').getOrElse('all')
        property 'skulk.trials.beams', providers.gradleProperty('trialBeams').getOrElse('false')
        property 'skulk.trials.repeats', providers.gradleProperty('trialRepeats').getOrElse('1')
        programArgs '--username', 'Player0', '--quickPlaySingleplayer', 'Skulk Trials'
    }
}

tasks.register('prepareParkourLiveWorld') {
    doLast {
        def destination = file('build/run/parkourLive/saves/Skulk Trials')
        def marker = new File(destination, '.skulk-disposable-trial')
        if (destination.exists()) {
            if (!marker.isFile()) throw new GradleException('Refusing to use an unmarked trial world.')
            return
        }
        def generated = file('build/run/clientGameTest/saves').listFiles()?.find {
            it.isDirectory() && new File(it, 'level.dat').isFile()
        }
        if (generated == null) throw new GradleException('Run runClientGameTest -PtrialCases=coordinate-selection first to create a disposable world.')
        copy { from generated; into destination; exclude 'session.lock' }
        marker.text = 'Generated by Skulk development trials; never use a personal world here.'
    }
}
tasks.named('runParkourLive') {
    dependsOn 'prepareParkourLiveWorld'
    doFirst { file('build/run/parkourLive/trial-status.txt').text = 'pending' }
    doLast {
        if (file('build/run/parkourLive/trial-status.txt').text != 'passed')
            throw new GradleException('Real-time trials failed or did not finish; inspect build/parkour-results.')
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    modImplementation("net.fabricmc:fabric-language-kotlin:1.13.1+kotlin.2.1.10")

    include modImplementation("io.github.0x3c50.renderer:renderer-fabric:1.2.5")

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    modGametestImplementation fabricApi.module('fabric-client-gametest-api-v1', project.fabric_version)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def expandedModVersion = project.version
def expandedMinecraftVersion = project.minecraft_version
def expandedLoaderVersion = project.loader_version

processResources {
    inputs.property "version", expandedModVersion
    inputs.property "minecraft_version", expandedMinecraftVersion
    inputs.property "loader_version", expandedLoaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": expandedModVersion,
                "minecraft_version": expandedMinecraftVersion,
                "loader_version": expandedLoaderVersion
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
